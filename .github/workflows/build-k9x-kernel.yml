name: Build K9x Kernel (BakaSU + HyperSU)

# OPPO K9x (MT6833, Linux 4.19.191)
#
# 本仓库只存放脚本, 内核源码由 workflow 从 OPPO 官方开源仓库现场 clone:
#   https://github.com/oppo-source/android_kernel_oppo_mt6833
#   分支 oppo/mt6833_t_13.0_a55_a53s_k9x_5g @ a4ec4ac5 (Linux 4.19.191)
# 这样推送量只有几十 KB, 弱网环境下也能秒传。
#
# 产物 (名称带方案标识, 不会混淆):
#   dist/k9x-resukisu-<commit>-4.19.191-<时间>.zip    ← BakaSU / ReSukiSU 版
#   dist/k9x-hypersu-<commit>-4.19.191-<时间>.zip     ← HyperSU 版
on:
  workflow_dispatch:
    inputs:
      variants:
        description: '要编译的方案 (空格分隔): bakasu hypersu, 或只填其一'
        required: false
        default: 'bakasu hypersu'
      kernel_ref:
        description: '内核分支/commit (留空用默认 k9x 分支)'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout (仅脚本)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 显示环境
        run: |
          echo "CPU: $(nproc) 核"
          free -h
          df -h "$PWD"
          ls -la

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 zip unzip git cpio rsync zlib1g-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 缓存 clang-r383902
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang-r383902
          key: clang-r383902-multi-mirror-v3

      # 说明: android.googlesource.com 的 +archive 接口对目录路径要求 ref 真实存在,
      # android-11.0.0_r48 这个 tag 在 prebuilts/clang/host/linux-x86 仓库里并不存在 -> 404。
      # 改用 GitHub 上的镜像仓库 (均为 clang 11.0.1 / build 6443078, 与原厂一致),
      # 其根目录即 clang-r383902 的内容 (bin/ lib/ lib64/ ...)。逐个尝试, 任一成功即可。
      - name: 下载 clang-r383902 (与设备原厂内核一致)
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -u
          rm -rf clang-tmp clang-r383902

          try_clone() {
            local url="$1" branch="$2" name="$3"
            echo "==> 尝试 [$name] $url ($branch)"
            rm -rf clang-tmp
            if git clone --depth=1 --single-branch --branch "$branch" "$url" clang-tmp 2>&1 | tail -3; then
              if [ -x clang-tmp/bin/clang ]; then
                echo "    成功: bin/clang 就绪"
                return 0
              fi
              echo "    结构异常: 缺少 bin/clang"
            else
              echo "    克隆失败"
            fi
            rm -rf clang-tmp
            return 1
          }

          ok=0
          # 镜像 1: crDroid (分支 10.0) —— 最常用, fork 数多
          try_clone "https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078.git" "10.0" "crdroid" && ok=1
          # 镜像 2: Ancient-Lab (分支 ten)
          if [ "$ok" = "0" ]; then
            try_clone "https://github.com/Ancient-Lab/prebuilts_clang_host_linux-x86_clang-r383902.git" "ten" "Ancient-Lab" && ok=1
          fi
          # 镜像 3: picasso09 (分支 11.0.1)
          if [ "$ok" = "0" ]; then
            try_clone "https://github.com/picasso09/clang-11.0.1-r383902.git" "11.0.1" "picasso09" && ok=1
          fi

          if [ "$ok" != "1" ]; then
            echo "所有 clang 镜像均失败"
            exit 1
          fi

          mv clang-tmp clang-r383902
          test -x clang-r383902/bin/clang || { echo "clang 路径异常"; exit 1; }
          chmod +x clang-r383902/bin/* 2>/dev/null || true
          ./clang-r383902/bin/clang --version | head -3

      - name: 校验 clang 版本
        run: |
          test -x ./clang-r383902/bin/clang || { echo "clang 不存在"; exit 1; }
          ./clang-r383902/bin/clang --version | head -1
          ./clang-r383902/bin/clang --version | grep -qE 'clang version 1[01]\.' \
            || echo "警告: clang 版本与原厂 11.0.1 不完全一致"

      - name: 预检脚本
        run: |
          for f in scripts/k9x-cloud-build.sh scripts/apply-resukisu-shim.sh scripts/apply-defconfig.sh; do
            test -f "$f" || { echo "缺少 $f"; exit 1; }
            bash -n "$f" || { echo "$f 语法错误"; exit 1; }
          done
          echo "脚本语法检查通过"

      - name: 编译两个方案
        env:
          WORK_DIR: ${{ github.workspace }}/work
          OUT_BASE: ${{ github.workspace }}/out
          CLANG_DIR: ${{ github.workspace }}/clang-r383902
          BUILD_VARIANTS: ${{ github.event.inputs.variants || 'bakasu hypersu' }}
          JOBS: 4
        run: |
          chmod +x scripts/*.sh
          mkdir -p logs
          # 完整日志同时写入 logs/build-console.log, 失败时随 artifact 上传
          bash scripts/k9x-cloud-build.sh 2>&1 | tee logs/build-console.log
          exit ${PIPESTATUS[0]}

      - name: 列出产物
        if: always()
        run: |
          echo "================ dist ================"
          ls -la dist/ 2>/dev/null || true

      - name: 上传产物 (BakaSU / ReSukiSU)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k9x-resukisu-BakaSU-${{ github.run_number }}
          path: |
            dist/k9x-resukisu-*.zip
            logs/build-console.log
            out/bakasu/build.log
            out/bakasu/config.log
            out/bakasu/.config
          if-no-files-found: warn
          retention-days: 30

      - name: 上传产物 (HyperSU)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k9x-hypersu-HyperSU-${{ github.run_number }}
          path: |
            dist/k9x-hypersu-*.zip
            logs/build-console.log
            out/hypersu/build.log
            out/hypersu/config.log
            out/hypersu/.config
          if-no-files-found: warn
          retention-days: 30

      - name: 编译失败时打印错误摘要
        if: failure()
        run: |
          echo "================ 错误摘要 ================"
          for v in bakasu hypersu; do
            if [ -f "out/$v/build.log" ]; then
              echo "---- $v ----"
              grep -nE 'error:|Error [0-9]|fatal error|undefined reference|No rule to make' \
                "out/$v/build.log" | head -30 || echo "(未匹配到典型错误行)"
              tail -20 "out/$v/build.log"
            fi
          done
